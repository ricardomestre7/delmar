server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # NOTA: em Nginx, um add_header dentro de um "location" anula os add_header do nivel
    # superior. Por isso os cabecalhos de seguranca sao repetidos em cada bloco.

    # Rotas limpas sem .html (ex: /sobre carrega /sobre.html ou /sobre/index.html)
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Codigo e paginas que mudam a cada correcao: o navegador guarda a copia mas REVALIDA
    # sempre (ETag -> 304 se nada mudou), por isso as correcoes chegam logo aos utilizadores.
    location ~* \.(?:js|mjs|css|json|webmanifest|html|svg|txt|xml)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # Binarios pesados e estaveis (imagens, fontes, audio, video, PDF): cache longa.
    # Se um destes ficheiros mudar, renomear o ficheiro.
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|avif|mp3|mp4|pdf|woff2?|ttf)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, no-transform" always;
    }

    # Compressao Gzip para economia de banda e velocidade maxima
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
